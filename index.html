<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gra do nauki angielskiego - Poziom Średniozaawansowany</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #1e272e; 
            color: #d2dae2;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .game-container { 
            background-color: #2c3e50; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            text-align: center; 
            max-width: 450px; 
            width: 90%; 
        }
        h1 { color: #f39c12; font-size: 26px; margin-bottom: 5px;}
        p.subtitle { color: #95a5a6; font-size: 15px; margin-top: 0; margin-bottom: 20px;}
        .word-display { 
            font-size: 32px; 
            font-weight: bold; 
            color: #ecf0f1; 
            margin: 20px 0; 
            padding: 20px;
            background: #34495e;
            border-radius: 10px;
            letter-spacing: 1px;
        }
        .options { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        button { 
            padding: 14px; 
            font-size: 16px; 
            font-weight: 600;
            border: none; 
            border-radius: 8px; 
            background-color: #2980b9; 
            color: white; 
            cursor: pointer; 
            transition: all 0.2s ease; 
        }
        button:hover:not(:disabled) { 
            background-color: #3498db; 
            transform: scale(1.02);
        }
        button:disabled { 
            cursor: not-allowed; 
            opacity: 0.8;
        }
        .score { 
            margin-top: 25px; 
            font-size: 18px; 
            color: #bdc3c7; 
            background: #22313f;
            padding: 12px;
            border-radius: 8px;
        }
        .message { 
            margin-top: 15px; 
            font-size: 20px; 
            font-weight: bold;
            min-height: 30px; 
        }
        .correct { color: #2ecc71; }
        .wrong { color: #e74c3c; }
        
        /* Styl odtwarzacza muzyki */
        .music-control {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #7f8c8d;
        }
        .music-btn {
            background-color: #8e44ad;
            font-size: 14px;
            padding: 10px 15px;
        }
        .music-btn:hover:not(:disabled) {
            background-color: #9b59b6;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Angielski B1/B2 z MOBTEL 🇬🇧</h1>
        <p class="subtitle">Wybierz właściwe znaczenie (Poziom średniozaawansowany)</p>
        
        <div class="word-display" id="word">Loading...</div>
        <div class="options" id="options"></div>
        <div class="message" id="message"></div>
        
        <div class="score">Wynik: <span id="score">0</span> / <span id="total">0</span></div>

        <!-- Odtwarzacz muzyki -->
        <div class="music-control">
            <button id="musicToggle" class="music-btn">🎵 Włącz relaksującą muzykę</button>
            <audio id="bgMusic" loop>
                <!-- Używam darmowego utworu lo-fi z Pixabay jako muzyki tła -->
                <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
                Twoja przeglądarka nie obsługuje elementu audio.
            </audio>
        </div>
    </div>

    <script>
        // Słówka na poziomie B1/B2
        const vocabulary = [
            { en: "To emphasize", pl: ["podkreślać", "zastanawiać się", "unikać"], correct: 0 },
            { en: "Reluctant", pl: ["zrelaksowany", "niechętny", "niezawodny"], correct: 1 },
            { en: "To distinguish", pl: ["niszczyć", "zgadywać", "rozróżniać"], correct: 2 },
            { en: "Obsolete", pl: ["przestarzały", "oczywisty", "uparty"], correct: 0 },
            { en: "To persuade", pl: ["ścigać", "karać", "przekonywać"], correct: 2 },
            { en: "Coincidence", pl: ["współpraca", "zbieg okoliczności", "wypadek"], correct: 1 },
            { en: "Versatile", pl: ["wszechstronny", "wrażliwy", "pionowy"], correct: 0 },
            { en: "To hesitate", pl: ["ukrywać się", "wahać się", "spieszyć się"], correct: 1 },
            { en: "Briefcase", pl: ["krótka sprawa", "teczka / aktówka", "portfel"], correct: 1 },
            { en: "Sufficient", pl: ["cierpiący", "powierzchowny", "wystarczający"], correct: 2 },
            { en: "To anticipate", pl: ["brać udział", "przewidywać / oczekiwać", "zapominać"], correct: 1 },
            { en: "Tedious", pl: ["monotonny / żmudny", "przerażający", "tymczasowy"], correct: 0 }
        ];

        let score = 0;
        let totalQuestions = 0;
        let availableWords = [...vocabulary];

        const wordElement = document.getElementById('word');
        const optionsElement = document.getElementById('options');
        const scoreElement = document.getElementById('score');
        const totalElement = document.getElementById('total');
        const messageElement = document.getElementById('message');

        // Obsługa muzyki
        const bgMusic = document.getElementById('bgMusic');
        const musicToggle = document.getElementById('musicToggle');
        bgMusic.volume = 0.3; // Ustawia cichą głośność muzyki

        musicToggle.addEventListener('click', () => {
            if (bgMusic.paused) {
                bgMusic.play();
                musicToggle.textContent = "🔊 Wyłącz muzykę";
            } else {
                bgMusic.pause();
                musicToggle.textContent = "🎵 Włącz relaksującą muzykę";
            }
        });

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function loadNextWord() {
            messageElement.textContent = "";
            
            if (availableWords.length === 0) {
                wordElement.textContent = "Koniec gry! 🎉";
                optionsElement.innerHTML = `<button onclick="location.reload()" style="background-color: #27ae60;">Zagraj ponownie</button>`;
                return;
            }

            shuffle(availableWords);
            const wordData = availableWords.pop();
            wordElement.textContent = wordData.en;
            optionsElement.innerHTML = "";

            const options = wordData.pl.map((text, index) => ({ text, isCorrect: index === wordData.correct }));
            shuffle(options);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.textContent = opt.text;
                btn.onclick = () => checkAnswer(opt.isCorrect, btn, options);
                optionsElement.appendChild(btn);
            });
        }

        function checkAnswer(isCorrect, btn, allOptions) {
            const buttons = optionsElement.querySelectorAll('button');
            buttons.forEach(b => b.disabled = true);
            totalQuestions++;

            if (isCorrect) {
                btn.style.backgroundColor = '#27ae60'; 
                score++;
                messageElement.textContent = "Doskonale! 👏";
                messageElement.className = "message correct";
            } else {
                btn.style.backgroundColor = '#c0392b'; 
                buttons.forEach(b => {
                    const optionMatch = allOptions.find(o => o.text === b.textContent);
                    if (optionMatch && optionMatch.isCorrect) {
                        b.style.backgroundColor = '#27ae60';
                    }
                });
                messageElement.textContent = "Nie tym razem. ❌";
                messageElement.className = "message wrong";
            }

            scoreElement.textContent = score;
            totalElement.textContent = totalQuestions;

            setTimeout(loadNextWord, 2000);
        }

        shuffle(availableWords);
        loadNextWord();
    </script>
</body>
</html>
