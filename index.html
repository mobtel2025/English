<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gra do nauki angielskiego - 4 Poziomy</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #1e272e; 
            color: #d2dae2;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .game-container { 
            background-color: #2c3e50; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            text-align: center; 
            max-width: 450px; 
            width: 90%; 
            position: relative;
        }
        h1 { color: #f39c12; font-size: 26px; margin-bottom: 5px;}
        p.subtitle { color: #95a5a6; font-size: 15px; margin-top: 0; margin-bottom: 10px;}
        
        .level-badge {
            display: inline-block;
            background-color: #8e44ad;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .word-display { 
            font-size: 32px; 
            font-weight: bold; 
            color: #ecf0f1; 
            margin: 15px 0; 
            padding: 20px;
            background: #34495e;
            border-radius: 10px;
            letter-spacing: 1px;
        }
        .options { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        button.option-btn { 
            padding: 14px; 
            font-size: 16px; 
            font-weight: 600;
            border: none; 
            border-radius: 8px; 
            background-color: #2980b9; 
            color: white; 
            cursor: pointer; 
            transition: all 0.2s ease; 
        }
        button.option-btn:hover:not(:disabled) { 
            background-color: #3498db; 
            transform: scale(1.02);
        }
        button.option-btn:disabled { 
            cursor: not-allowed; 
            opacity: 0.8;
        }
        
        .level-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .level-btn {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-down { background-color: #16a085; }
        .btn-down:hover:not(:disabled) { background-color: #1abc9c; }
        .btn-up { background-color: #d35400; }
        .btn-up:hover:not(:disabled) { background-color: #e67e22; }
        
        .level-btn:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .score { 
            margin-top: 20px; 
            font-size: 18px; 
            color: #bdc3c7; 
            background: #22313f;
            padding: 12px;
            border-radius: 8px;
        }
        .message { 
            margin-top: 15px; 
            font-size: 20px; 
            font-weight: bold;
            min-height: 30px; 
        }
        .correct { color: #2ecc71; }
        .wrong { color: #e74c3c; }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Angielski z MOBTEL 🇬🇧</h1>
        <p class="subtitle">Wybierz właściwe znaczenie słowa</p>
        
        <div id="levelBadge" class="level-badge">Poziom 1: Podstawowy</div>
        
        <div class="word-display" id="word">Loading...</div>
        <div class="options" id="options"></div>
        <div class="message" id="message"></div>
        
        <div class="level-controls">
            <button id="levelDownBtn" class="level-btn btn-down" onclick="prevLevel()">⬇️ Niższy poziom</button>
            <button id="levelUpBtn" class="level-btn btn-up" onclick="nextLevel()">⬆️ Wyższy poziom</button>
        </div>

        <div class="score">Wynik: <span id="score">0</span> / <span id="total">0</span></div>

        <audio id="bgMusic" loop preload="auto">
            <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        const levels = [
            {
                name: "Poziom 1: Podstawowy (A1/A2)",
                words: [
                    { en: "apple", pl: ["jabłko", "gruszka", "banan"], correct: 0 },
                    { en: "house", pl: ["szkoła", "samochód", "dom"], correct: 2 },
                    { en: "water", pl: ["woda", "ogień", "ziemia"], correct: 0 },
                    { en: "book", pl: ["zeszyt", "książka", "długopis"], correct: 1 },
                    { en: "tree", pl: ["drzewo", "kwiat", "trawa"], correct: 0 }
                ]
            },
            {
                name: "Poziom 2: Średni (B1)",
                words: [
                    { en: "reluctant", pl: ["zrelaksowany", "niechętny", "niezawodny"], correct: 1 },
                    { en: "obsolete", pl: ["przestarzały", "oczywisty", "uparty"], correct: 0 },
                    { en: "to persuade", pl: ["ścigać", "karać", "przekonywać"], correct: 2 },
                    { en: "briefcase", pl: ["krótka sprawa", "teczka / aktówka", "portfel"], correct: 1 },
                    { en: "tedious", pl: ["monotonny / żmudny", "przerażający", "tymczasowy"], correct: 0 }
                ]
            },
            {
                name: "Poziom 3: Zaawansowany (B2/C1)",
                words: [
                    { en: "ambiguous", pl: ["ambitny", "dwuznaczny", "pewny"], correct: 1 },
                    { en: "ubiquitous", pl: ["wszechobecny", "unikalny", "ukryty"], correct: 0 },
                    { en: "resilient", pl: ["odporny / elastyczny", "leniwy", "zrezygnowany"], correct: 0 },
                    { en: "to mitigate", pl: ["podróżować", "naśladować", "łagodzić"], correct: 2 },
                    { en: "viable", pl: ["wykonalny / opłacalny", "widoczny", "wulgarny"], correct: 0 }
                ]
            },
            {
                name: "Poziom 4: Ekspert (C2)",
                words: [
                    { en: "ephemeral", pl: ["wieczny", "ulotny / krótkotrwały", "materialny"], correct: 1 },
                    { en: "fastidious", pl: ["szybki", "drobiazgowy / wymagający", "wściekły"], correct: 1 },
                    { en: "sycophant", pl: ["psychopata", "pochlebca / lizus", "naukowiec"], correct: 1 },
                    { en: "quintessential", pl: ["pięciokrotny", "spokojny", "stanowiący kwintesencję"], correct: 2 },
                    { en: "to obfuscate", pl: ["zaciemniać / gmatwać", "obserwować", "obrażać"], correct: 0 }
                ]
            }
        ];

        let currentLevelIndex = 0;
        let score = 0;
        let totalQuestions = 0;
        let availableWords = [];

        const wordElement = document.getElementById('word');
        const optionsElement = document.getElementById('options');
        const scoreElement = document.getElementById('score');
        const totalElement = document.getElementById('total');
        const messageElement = document.getElementById('message');
        const levelBadge = document.getElementById('levelBadge');
        const levelUpBtn = document.getElementById('levelUpBtn');
        const levelDownBtn = document.getElementById('levelDownBtn');
        const bgMusic = document.getElementById('bgMusic');

        bgMusic.volume = 0.2;

        document.body.addEventListener('click', function startMusic() {
            if (bgMusic.paused) {
                bgMusic.play().catch(e => console.log("Auto-play zablokowany"));
            }
            document.body.removeEventListener('click', startMusic);
        });

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function startGame() {
            score = 0;
            totalQuestions = 0;
            scoreElement.textContent = score;
            totalElement.textContent = totalQuestions;
            
            levelBadge.textContent = levels[currentLevelIndex].name;
            availableWords = [...levels[currentLevelIndex].words];
            shuffle(availableWords);

            levelUpBtn.disabled = currentLevelIndex >= levels.length - 1;
            levelDownBtn.disabled = currentLevelIndex <= 0;

            loadNextWord();
        }

        function nextLevel() {
            if (currentLevelIndex < levels.length - 1) {
                currentLevelIndex++;
                startGame();
            }
        }

        function prevLevel() {
            if (currentLevelIndex > 0) {
                currentLevelIndex--;
                startGame();
            }
        }

        function loadNextWord() {
            messageElement.textContent = "";
            
            if (availableWords.length === 0) {
                wordElement.textContent = "Koniec słówek! 🎉";
                if (currentLevelIndex < levels.length - 1) {
                    optionsElement.innerHTML = `<button class="option-btn" style="background-color: #d35400;" onclick="nextLevel()">Przejdź do następnego poziomu</button>`;
                } else {
                    optionsElement.innerHTML = `<button class="option-btn" style="background-color: #27ae60;" onclick="currentLevelIndex=0; startGame()">Zagraj od nowa</button>`;
                }
                return;
            }

            const wordData = availableWords.pop();
            wordElement.textContent = wordData.en;
            optionsElement.innerHTML = "";

            const options = wordData.pl.map((text, index) => ({ text, isCorrect: index === wordData.correct }));
            shuffle(options);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt.text;
                btn.onclick = () => checkAnswer(opt.isCorrect, btn, options);
                optionsElement.appendChild(btn);
            });
        }

        function checkAnswer(isCorrect, btn, allOptions) {
            const buttons = optionsElement.querySelectorAll('button.option-btn');
            buttons.forEach(b => b.disabled = true);
            totalQuestions++;

            if (isCorrect) {
                btn.style.backgroundColor = '#27ae60'; 
                score++;
                messageElement.textContent = "Doskonale! 👏";
                messageElement.className = "message correct";
            } else {
                btn.style.backgroundColor = '#c0392b'; 
                buttons.forEach(b => {
                    const optionMatch = allOptions.find(o => o.text === b.textContent);
                    if (optionMatch && optionMatch.isCorrect) {
                        b.style.backgroundColor = '#27ae60';
                    }
                });
                messageElement.textContent = "Nie tym razem. ❌";
                messageElement.className = "message wrong";
            }

            scoreElement.textContent = score;
            totalElement.textContent = totalQuestions;

            setTimeout(loadNextWord, 2000);
        }

        startGame();
    </script>
</body>
</html>
